[tool.poetry]
name = "python-rekor-monitor"
version = "0.1.0"
description = ""
authors = ["Tamerlan Bektrumov <tamermovi@gmail.com>"]
license = "MIT"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
requests = "^2.34.2"
cryptography = "^50.0.2"


[tool.poetry.group.dev.dependencies]
ruff = "^0.17.1"
mypy = "^2.4.0"
types-requests = "^2.33.0.20261006"
bandit = "^1.9.4"
pytest = "^9.1.1"
pytest-cov = "^7.1.0"
radon = "^6.0.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]

select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
strict = true
exclude = ["tests"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=. --cov-report=term-missing"

[tool.coverage.run]
omit = ["tests/*", "scripts/*"]
